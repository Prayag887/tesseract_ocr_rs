name: Docker (RHEL/Rocky) — build & smoke test

# Builds the three service images on Rocky 10 and actually RUNS them, which
# is the part `build.yml` cannot cover: that workflow compiles and unit-tests
# the crates, but a crate can compile fine and still die at startup if the
# prebuilt libonnxruntime `ort` downloads won't load against RHEL's glibc.
#
# Each src/main.rs loads its ONNX models with .expect() before serving, so a
# container that reaches its HEALTHCHECK has proven the whole RHEL chain:
# OpenCV 5 linked, libonnxruntime loaded, models parsed. That is why the
# smoke test below is a genuine test and not a liveness ping.

on:
  push:
    branches: [rhel_prod, prod, main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built images to GHCR (so they can be pulled and run elsewhere)"
        type: boolean
        default: false

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    # OpenCV 5 is compiled from source. First run is roughly 60-90 min; the
    # ceiling is generous so a slow runner fails on a real error, not a clock.
    timeout-minutes: 180

    steps:
      # OpenCV's source tree, its build tree, LLVM/clang, the Rust toolchain
      # and three LTO'd cargo target dirs do not fit in a stock runner's free
      # space. This reclaims ~20 GB of preinstalled SDKs none of which this
      # build touches.
      - name: Free up disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v4

      # Build order matters. All three Dockerfiles share a byte-identical
      # prefix through the OpenCV install, so building nid ALONE first
      # compiles OpenCV once and leaves it in the local BuildKit cache; the
      # other two then hit that cache instead of each recompiling it.
      # `docker compose build` with no service argument would build all three
      # in parallel, so three containers would compile the same OpenCV
      # simultaneously on a 4-core runner — slower and far more disk.
      #
      # No cross-run `type=gha` cache here on purpose: the Actions cache is
      # capped at 10 GB per repo and these builder layers blow through that,
      # which causes constant eviction churn rather than speedups. The
      # within-run sharing above is where the real saving is.
      - name: Build nid-scan-service (compiles OpenCV 5)
        run: docker compose build nid-scan-service

      - name: Build remaining services (reuse the OpenCV layer)
        run: |
          docker compose build passport-scan-service
          docker compose build citizenship-scan-service

      - name: Show built images
        run: docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | grep -i ocr

      # --wait blocks until every service with a HEALTHCHECK reports healthy,
      # so this step failing IS the port failing.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Verify the RHEL runtime
        run: |
          set -euo pipefail
          echo "--- container state ---"
          docker compose ps

          echo "--- the images are actually RHEL ---"
          docker compose exec -T nid-scan-service cat /etc/os-release | head -2
          docker compose exec -T nid-scan-service ldd --version | head -1

          # Ask compose for the published port rather than assuming one: the
          # committed .env overrides GATEWAY_HOST_PORT (3006 today, not the
          # compose default of 3002), so a hardcoded port here would fail with
          # a connection refused that looks nothing like its actual cause.
          base="http://localhost:$(docker compose port gateway 80 | cut -d: -f2)"
          echo "gateway: $base"

          echo "--- health through the gateway ---"
          for svc in nid passport citizenship; do
            printf '%s: ' "$svc"
            curl -fsS --max-time 30 "$base/$svc/health"
            echo
          done

          echo "--- UI is served ---"
          curl -fsS --max-time 30 -o /dev/null -w 'index.html %{http_code}\n' "$base/"

      # Without this a failure above shows only "unhealthy" with no reason.
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

      # Opt-in only, and never on a PR. Lets you `docker pull` the RHEL images
      # and run them from a Mac (they are linux/amd64, so Docker Desktop will
      # emulate on Apple silicon — correctness holds, speed suffers).
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          set -euo pipefail
          # GHCR rejects uppercase path segments; repository_owner may have them.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_SHA::7}"
          for svc in nid passport citizenship; do
            src="ocr-${svc}-scan-service:latest"
            dst="ghcr.io/${owner}/ocr-${svc}-scan-service"
            docker tag "$src" "${dst}:${tag}"
            docker tag "$src" "${dst}:latest"
            docker push "${dst}:${tag}"
            docker push "${dst}:latest"
            echo "pushed ${dst}:${tag}"
          done

    permissions:
      contents: read
      packages: write
