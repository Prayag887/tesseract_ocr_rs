name: Docker (RHEL/Rocky) — build, smoke test & publish

# Builds the exact Rocky Linux 10 images used for deployment and then
# actually starts the complete docker-compose stack.
#
# This is intentionally more than a Dockerfile syntax/build check.
#
# Each scanner loads OpenCV, ONNX Runtime and its ONNX models before it starts
# serving requests. Reaching HEALTHCHECK therefore proves that:
#
#   - the image builds successfully on Rocky 10
#   - OpenCV 5 links and loads correctly
#   - libonnxruntime loads against Rocky 10's glibc/libstdc++
#   - the ONNX models can be opened and parsed
#   - every scanner starts successfully
#   - nginx can route traffic to every scanner
#
# The GitHub runner itself is Ubuntu only because GitHub does not provide a
# hosted RHEL runner. The deployment environment being tested is the Rocky 10
# userspace INSIDE the built images.

on:
  push:
    branches: [prod, main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-rhel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    # A cold cache has to compile LLVM/OpenCV/Rust-heavy images from source.
    # Warm runs are dramatically faster, but the ceiling needs to account for
    # the genuinely expensive cold path.
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write

    steps:
      # GitHub-hosted runners contain many large SDKs that are irrelevant to
      # this project. OpenCV's build tree plus three Rust target trees can
      # otherwise exhaust the runner disk during a cold build.
      - name: Free up disk space
        run: |
          set -euo pipefail

          echo "--- disk before cleanup ---"
          df -h /

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"

          sudo docker image prune -af || true

          echo
          echo "--- disk after cleanup ---"
          df -h /

      - uses: actions/checkout@v4

      # GHCR requires image paths to be lowercase, while GitHub preserves the
      # capitalization used when the repository owner was registered.
      #
      # One shared registry cache is used for all three Dockerfiles because
      # their expensive Rocky/OpenCV prefix is deliberately identical.
      - name: Compute image and cache refs
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "cache_ref=ghcr.io/${repo}/buildcache" >> "$GITHUB_OUTPUT"

          echo "nid_ref=ghcr.io/${owner}/ocr-nid-scan-service" >> "$GITHUB_OUTPUT"
          echo "passport_ref=ghcr.io/${owner}/ocr-passport-scan-service" >> "$GITHUB_OUTPUT"
          echo "citizenship_ref=ghcr.io/${owner}/ocr-citizenship-scan-service" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # PRs, especially fork PRs, do not necessarily have a write-capable
      # GITHUB_TOKEN. Normal pushes can both read/write the registry cache and
      # later publish the resulting service images.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------------
      # Build images
      # --------------------------------------------------------------------
      #
      # These are intentionally NOT a matrix.
      #
      # On a completely cold runner, all three Dockerfiles need the same
      # expensive Rocky + OpenCV prefix. Running them in parallel would allow
      # BuildKit to compile OpenCV three times concurrently.
      #
      # Building NID first populates the local BuildKit cache. Passport and
      # citizenship then reuse that prefix immediately.
      #
      # A GHCR registry cache is used instead of type=gha because the complete
      # LLVM/OpenCV/Cargo layer set can exceed the Actions cache quota.

      - name: Build nid-scan-service
        uses: docker/build-push-action@v6
        with:
          context: ./nid-scan-service
          platforms: linux/amd64
          tags: ocr-nid-scan-service:latest
          load: true
          push: false
          cache-from: |
            type=registry,ref=${{ steps.vars.outputs.cache_ref }}:rocky10
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:rocky10,mode=max', steps.vars.outputs.cache_ref) || '' }}

      - name: Build passport-scan-service
        uses: docker/build-push-action@v6
        with:
          context: ./passport-scan-service
          platforms: linux/amd64
          tags: ocr-passport-scan-service:latest
          load: true
          push: false
          cache-from: |
            type=registry,ref=${{ steps.vars.outputs.cache_ref }}:rocky10

      - name: Build citizenship-scan-service
        uses: docker/build-push-action@v6
        with:
          context: ./citizenship_scanner
          platforms: linux/amd64
          tags: ocr-citizenship-scan-service:latest
          load: true
          push: false
          cache-from: |
            type=registry,ref=${{ steps.vars.outputs.cache_ref }}:rocky10

      - name: Show built images
        run: |
          docker images \
            --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' \
            | grep -Ei 'REPOSITORY|ocr-'

      # --------------------------------------------------------------------
      # Runtime test
      # --------------------------------------------------------------------

      # docker-compose.yml already refers to the local tags produced above,
      # therefore --no-build is important: the smoke test must run precisely
      # the images BuildKit just produced rather than silently rebuilding a
      # different image through Compose.
      #
      # --wait waits for all services that define HEALTHCHECK to become
      # healthy. Scanner startup itself loads ONNX Runtime + OpenCV + models,
      # so reaching healthy is part of the compatibility test.
      - name: Start complete deployment stack
        run: |
          docker compose up \
            -d \
            --no-build \
            --wait \
            --wait-timeout 300

      - name: Verify Rocky/RHEL runtime and services
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "Container state"
          echo "=================================================="

          docker compose ps

          echo
          echo "=================================================="
          echo "Verify scanner is actually running Rocky Linux"
          echo "=================================================="

          # Keep the pipe inside the container shell. Piping docker exec into
          # head on the host can make docker return 255 after head closes the
          # pipe early, which becomes a false failure under pipefail.
          docker compose exec -T nid-scan-service sh -c \
            'grep -E "^(NAME|VERSION|VERSION_ID)=" /etc/os-release; ldd --version | head -1'

          echo
          echo "=================================================="
          echo "Determine gateway port"
          echo "=================================================="

          # Never hard-code this. The committed .env may override
          # GATEWAY_HOST_PORT.
          gateway_port="$(
            docker compose port gateway 80 \
              | tail -1 \
              | awk -F: '{print $NF}'
          )"

          test -n "$gateway_port"

          base="http://127.0.0.1:${gateway_port}"

          echo "Gateway: ${base}"

          echo
          echo "=================================================="
          echo "Wait for nginx gateway"
          echo "=================================================="

          # Compose considers containers without HEALTHCHECK started as soon
          # as their process launches. nginx can therefore still be a fraction
          # of a second away from accepting TCP connections even though all
          # scanner containers are already healthy.
          for i in $(seq 1 30); do
            if curl \
              -fsS \
              --max-time 5 \
              -o /dev/null \
              "${base}/nid/health" 2>/dev/null; then

              echo "Gateway ready after ${i}s"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Gateway never accepted connections" >&2
              exit 1
            fi

            sleep 1
          done

          echo
          echo "=================================================="
          echo "Health checks through nginx"
          echo "=================================================="

          for svc in nid passport citizenship; do
            printf '%-12s ' "${svc}:"

            curl \
              -fsS \
              --max-time 30 \
              "${base}/${svc}/health"

            echo
          done

          echo
          echo "=================================================="
          echo "Shared UI"
          echo "=================================================="

          curl \
            -fsS \
            --max-time 30 \
            -o /tmp/index.html \
            -w 'index.html -> HTTP %{http_code}\n' \
            "${base}/"

          grep -qi '<!DOCTYPE html' /tmp/index.html

          echo
          echo "RHEL/Rocky deployment smoke test passed."

      # Without container logs, a failure caused by libonnxruntime, OpenCV,
      # model loading or nginx routing is reduced to an unhelpful "unhealthy"
      # result in the Actions UI.
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=================================================="
          echo "Container state"
          echo "=================================================="

          docker compose ps -a || true

          echo
          echo "=================================================="
          echo "Container logs"
          echo "=================================================="

          docker compose logs \
            --no-color \
            --tail=300 || true

      # --------------------------------------------------------------------
      # Publish
      # --------------------------------------------------------------------
      #
      # Preserve the behaviour of the old docker-images workflow:
      #
      #   PR             -> build + test only
      #   prod/main/dev  -> build + test + publish
      #   manual run     -> build + test + publish
      #
      # Crucially, publishing happens AFTER the smoke test. A broken image is
      # therefore never promoted merely because Docker managed to build it.

      - name: Publish images to GHCR
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          sha_tag="${GITHUB_SHA::7}"

          publish() {
            local local_image="$1"
            local remote_image="$2"

            echo "Publishing ${local_image}"

            docker tag \
              "${local_image}:latest" \
              "${remote_image}:${sha_tag}"

            docker push \
              "${remote_image}:${sha_tag}"

            # Keep `latest` for main, matching docker/metadata-action's
            # previous default-branch semantics.
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              docker tag \
                "${local_image}:latest" \
                "${remote_image}:latest"

              docker push \
                "${remote_image}:latest"
            fi
          }

          publish \
            "ocr-nid-scan-service" \
            "${{ steps.vars.outputs.nid_ref }}"

          publish \
            "ocr-passport-scan-service" \
            "${{ steps.vars.outputs.passport_ref }}"

          publish \
            "ocr-citizenship-scan-service" \
            "${{ steps.vars.outputs.citizenship_ref }}"

      - name: Tear down
        if: always()
        run: |
          docker compose down \
            -v \
            --remove-orphans