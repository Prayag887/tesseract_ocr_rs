name: Docker (RHEL/Rocky) — build & smoke test

# Builds the three service images on Rocky 10 and actually RUNS them, which
# is the part `build.yml` cannot cover: that workflow compiles and unit-tests
# the crates, but a crate can compile fine and still die at startup if the
# prebuilt libonnxruntime `ort` downloads won't load against RHEL's glibc.
#
# Each src/main.rs loads its ONNX models with .expect() before serving, so a
# container that reaches its HEALTHCHECK has proven the whole RHEL chain:
# OpenCV 5 linked, libonnxruntime loaded, models parsed. That is why the
# smoke test below is a genuine test and not a liveness ping.

on:
  push:
    branches: [rhel_prod, prod, main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built images to GHCR (so they can be pulled and run elsewhere)"
        type: boolean
        default: false

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    # Cold cache (OpenCV compiled from source) is the slow path; a warm cache
    # is far quicker. The ceiling is generous so a slow runner fails on a real
    # error rather than a clock.
    timeout-minutes: 180

    permissions:
      contents: read
      packages: write

    steps:
      # OpenCV's build tree, LLVM/clang, the Rust toolchain and three LTO'd
      # cargo target dirs do not fit in a stock runner's free space. This
      # reclaims ~20 GB of preinstalled SDKs none of which this build touches.
      - name: Free up disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v4

      # GHCR rejects uppercase path segments, and github.repository preserves
      # whatever case the owner registered with.
      - name: Compute cache ref
        id: vars
        run: |
          echo "cache_ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/buildcache" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # A pull_request from a fork gets no write-capable token, so cache
      # export is skipped there (see cache-to below) — but logging in is still
      # worth attempting for cache *reads* on the same-repo case.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Why a registry cache and not `type=gha`: the Actions cache is capped
      # at 10 GB per repo and these builder layers (LLVM + OpenCV + cargo)
      # blow straight through it, so entries evict each other and every run
      # ends up cold. GHCR has no such cap, so the expensive OpenCV layer is
      # compiled once ever and pulled thereafter.
      #
      # All three Dockerfiles share a byte-identical prefix through the
      # OpenCV install, so ONE shared cache ref serves all three. Only this
      # first build exports (mode=max), because its layers already cover the
      # whole shared prefix; the other two would just rewrite the same blobs.
      #
      # Build order still matters on a COLD cache: nid alone first means
      # OpenCV compiles once, then the other two hit the local layer cache.
      # Building all three at once would compile OpenCV three times in
      # parallel on a 4-core runner.
      - name: Build nid-scan-service
        uses: docker/build-push-action@v6
        with:
          context: ./nid-scan-service
          tags: ocr-nid-scan-service:latest
          load: true
          cache-from: type=registry,ref=${{ steps.vars.outputs.cache_ref }}:rocky10
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:rocky10,mode=max', steps.vars.outputs.cache_ref) || '' }}

      - name: Build passport-scan-service
        uses: docker/build-push-action@v6
        with:
          context: ./passport-scan-service
          tags: ocr-passport-scan-service:latest
          load: true
          cache-from: type=registry,ref=${{ steps.vars.outputs.cache_ref }}:rocky10

      - name: Build citizenship-scan-service
        uses: docker/build-push-action@v6
        with:
          context: ./citizenship_scanner
          tags: ocr-citizenship-scan-service:latest
          load: true
          cache-from: type=registry,ref=${{ steps.vars.outputs.cache_ref }}:rocky10

      - name: Show built images
        run: docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | grep -i ocr

      # --no-build because the three images above are already loaded into the
      # daemon under exactly the tags docker-compose.yml names. --wait blocks
      # until every service with a HEALTHCHECK reports healthy, so this step
      # failing IS the port failing.
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Verify the RHEL runtime
        run: |
          set -euo pipefail
          echo "--- container state ---"
          docker compose ps

          # The trimming runs INSIDE the container on purpose. Piping
          # `docker compose exec` into `head` on the host lets head exit first,
          # which closes the pipe, kills the exec with EPIPE and makes it
          # return 255 — and `set -o pipefail` then fails the whole step even
          # though the command worked fine. Keeping the pipe inside one `sh -c`
          # means the host only ever sees the final, complete output.
          echo "--- the images are actually RHEL ---"
          docker compose exec -T nid-scan-service sh -c \
            'grep -E "^(NAME|VERSION)=" /etc/os-release; ldd --version | head -1'

          # Ask compose for the published port rather than assuming one: the
          # committed .env overrides GATEWAY_HOST_PORT (3006 today, not the
          # compose default of 3002), so a hardcoded port here would fail with
          # a connection refused that looks nothing like its actual cause.
          base="http://localhost:$(docker compose port gateway 80 | cut -d: -f2)"
          echo "gateway: $base"

          # `up --wait` only waits on services that define a HEALTHCHECK, and
          # the nginx gateway does not — compose calls it started the moment
          # the process execs, which is why it shows "Up Less than a second"
          # while the backends are already healthy. Without this poll the
          # first curl can lose the race and report a connection refused that
          # looks like a routing bug.
          echo "--- waiting for the gateway to accept connections ---"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null "$base/nid/health" 2>/dev/null; then
              echo "gateway ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "gateway never accepted connections" >&2
              exit 1
            fi
            sleep 1
          done

          echo "--- health through the gateway ---"
          for svc in nid passport citizenship; do
            printf '%s: ' "$svc"
            curl -fsS --max-time 30 "$base/$svc/health"
            echo
          done

          echo "--- UI is served ---"
          curl -fsS --max-time 30 -o /dev/null -w 'index.html %{http_code}\n' "$base/"

      # Without this a failure above shows only "unhealthy" with no reason.
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

      # Opt-in only, and never on a PR. Lets you `docker pull` the RHEL images
      # and run them from a Mac (they are linux/amd64, so Docker Desktop will
      # emulate on Apple silicon — correctness holds, speed suffers).
      - name: Push images to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_SHA::7}"
          for svc in nid passport citizenship; do
            src="ocr-${svc}-scan-service:latest"
            dst="ghcr.io/${owner}/ocr-${svc}-scan-service"
            docker tag "$src" "${dst}:${tag}"
            docker tag "$src" "${dst}:latest"
            docker push "${dst}:${tag}"
            docker push "${dst}:latest"
            echo "pushed ${dst}:${tag}"
          done
