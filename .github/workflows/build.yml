name: Build & Test

on:
  push:
    branches: [prod, main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        crate: [nid-scan-service, passport-scan-service, citizenship_scanner]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Report OS/toolchain
        run: |
          lsb_release -a || cat /etc/os-release
          gcc --version
          g++ --version

      - name: Install build deps
        # apt has no wall-clock cap of its own — a mirror that trickles data
        # slowly (rather than dropping the connection outright) never hits
        # Acquire::http::Timeout, which only fires on a dead-quiet socket.
        # azure.archive.ubuntu.com has been slow enough to do exactly that,
        # so `timeout` here is what actually bounds the step: 3 tries at
        # 3 minutes each, hard-killed and retried on the next attempt rather
        # than left to crawl for the rest of the job.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2 3; do
            sudo timeout 180 apt-get update && break
            echo "apt-get update attempt $i timed out or failed, retrying"
            sleep 5
          done
          for i in 1 2 3; do
            sudo timeout 180 apt-get install -y --no-install-recommends \
              cmake ninja-build git pkg-config \
              clang libclang-dev llvm-dev \
              libjpeg-dev libpng-dev libtiff-dev libwebp-dev libopenexr-dev \
              libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
              zlib1g-dev && break
            echo "apt-get install attempt $i timed out or failed, retrying"
            sleep 5
          done

      - name: Locate libclang
        run: |
          found="$(sudo find / -xdev \( -name 'libclang-*.so*' -o -name 'libclang.so*' \) 2>/dev/null | head -1)"
          echo "found: $found"
          test -n "$found"
          libdir="$(dirname "$found")"
          echo "LIBCLANG_PATH=$libdir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$libdir:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # Ubuntu's own libopencv-dev is 4.6 - this project needs OpenCV 5's
      # `geometry` module, so it's built from source here, matching the
      # Dockerfile exactly (same version, same trimmed module set).
      - name: Cache OpenCV 5 build
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: opencv5-${{ runner.os }}-v2

      - name: Build & install OpenCV 5
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch 5.0.0 --depth 1 https://github.com/opencv/opencv.git /tmp/opencv-src
          cmake -S /tmp/opencv-src -B /tmp/opencv-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DOPENCV_GENERATE_PKGCONFIG=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_LIST=core,imgproc,imgcodecs,geometry,flann \
            -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF \
            -DBUILD_JAVA=OFF -DBUILD_opencv_apps=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_DOCS=OFF \
            -DWITH_CUDA=OFF -DWITH_CUDNN=OFF -DWITH_OPENCL=OFF -DWITH_IPP=OFF -DWITH_ITT=OFF
          cmake --build /tmp/opencv-build -j"$(nproc)"
          sudo cmake --install /tmp/opencv-build

      - name: ldconfig
        run: sudo ldconfig

      - name: Set OpenCV pkg-config path
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib64/pkgconfig" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Build (release)
        run: cargo build --release

      - name: Test (release)
        run: cargo test --release
