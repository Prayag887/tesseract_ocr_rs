name: Build & Test - RHEL

on:
  push:
    branches: [prod, main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # GitHub does not provide a hosted RHEL runner.
    #
    # ubuntu-latest is only the Docker host. Every `run:` step in this job
    # executes inside Rocky Linux 10, giving us a RHEL 10-compatible
    # userspace for compilation, linking and tests.
    #
    # Rocky 10 is used instead of Rocky 9 because the prebuilt ONNX Runtime
    # downloaded by the `ort` crate can require newer glibc/libstdc++
    # symbols than Rocky/RHEL 9 provides.
    runs-on: ubuntu-latest

    container:
      image: rockylinux/rockylinux:10

      # The minimal Rocky image does not provide a useful PATH in its image
      # configuration for GitHub Actions. Define it explicitly so Actions
      # which manipulate GITHUB_PATH do not accidentally leave the job
      # unable to find bash/sh/git/etc.
      #
      # Rust is installed under /opt/rust rather than /usr/local because
      # /usr/local is cached below for OpenCV.
      env:
        PATH: /opt/rust/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        RUSTUP_HOME: /opt/rust/rustup
        CARGO_HOME: /opt/rust/cargo

    # A cold OpenCV build can be slow on GitHub-hosted runners.
    timeout-minutes: 90

    strategy:
      fail-fast: false

      # All three crates use the exact same OpenCV cache key.
      #
      # Running the matrix in parallel on a cold cache would make all three
      # jobs miss the cache at the same time and compile OpenCV independently.
      # Serial execution means the first job builds/saves OpenCV and the other
      # two restore it.
      max-parallel: 1

      matrix:
        crate:
          - nid-scan-service
          - passport-scan-service
          - citizenship_scanner

    defaults:
      run:
        # GitHub container jobs otherwise default to sh. Use bash explicitly
        # because the workflow relies on normal bash behaviour and pipefail.
        shell: bash

        working-directory: ${{ matrix.crate }}

    steps:
      # Must run before checkout.
      #
      # The stock Rocky image does not contain git/tar, while checkout,
      # actions/cache and rust-cache depend on them.
      #
      # clang-devel, llvm-devel and OpenEXR development packages are
      # available through CRB on Rocky 10.
      #
      # RHEL/Rocky 10 uses zlib-ng-compat-devel for the traditional zlib ABI.
      - name: Install build dependencies
        working-directory: /
        run: |
          set -euo pipefail

          dnf -y install dnf-plugins-core

          dnf config-manager --set-enabled crb

          dnf -y install \
            gcc \
            gcc-c++ \
            make \
            cmake \
            ninja-build \
            git \
            tar \
            gzip \
            xz \
            curl \
            ca-certificates \
            which \
            findutils \
            pkgconf-pkg-config \
            clang \
            clang-devel \
            llvm-devel \
            libjpeg-turbo-devel \
            libpng-devel \
            libtiff-devel \
            libwebp-devel \
            openexr-devel \
            zlib-ng-compat-devel \
            openssl-devel

      - uses: actions/checkout@v4

      # citizenship_scanner currently commits a macOS/Homebrew-specific
      # .cargo/config.toml containing paths such as:
      #
      #   /opt/homebrew/...
      #   /Library/Developer/CommandLineTools/...
      #
      # Those must not affect the RHEL build.
      #
      # This also mirrors the production Dockerfiles if they intentionally
      # copy Cargo.toml/Cargo.lock/src without copying .cargo/.
      - name: Ignore macOS-only Cargo configuration
        run: |
          rm -f .cargo/config.toml

      - name: Report RHEL-compatible environment
        run: |
          set -euo pipefail

          echo "===== OS ====="
          cat /etc/os-release

          echo
          echo "===== GCC ====="
          gcc --version

          echo
          echo "===== G++ ====="
          g++ --version

          echo
          echo "===== glibc ====="

          # Avoid `ldd --version | head -1`.
          #
          # With GitHub Actions' pipefail enabled, head can close the pipe
          # before ldd finishes writing, causing ldd to receive SIGPIPE and
          # the step to fail with exit code 141.
          glibc_version="$(ldd --version)"
          printf '%s\n' "$glibc_version" | sed -n '1p'

          echo
          echo "===== kernel ====="
          uname -a

      # clang-devel normally installs libclang into /usr/lib64 on Rocky/RHEL.
      # Bindgen used by opencv-rust needs to locate it.
      - name: Locate libclang
        run: |
          set -euo pipefail

          if [ -e /usr/lib64/libclang.so ]; then
            LIBCLANG_DIR=/usr/lib64
          else
            found="$(
              find /usr/lib64 /usr/lib \
                \( \
                  -name 'libclang.so' \
                  -o -name 'libclang.so.*' \
                  -o -name 'libclang-*.so' \
                  -o -name 'libclang-*.so.*' \
                \) \
                2>/dev/null \
                | sed -n '1p'
            )"

            test -n "$found"

            LIBCLANG_DIR="$(dirname "$found")"
          fi

          echo "LIBCLANG_PATH=$LIBCLANG_DIR" >> "$GITHUB_ENV"

          echo "Found libclang in: $LIBCLANG_DIR"

      # Rocky/RHEL repositories do not provide the OpenCV 5 build required
      # by this project. In particular, the project needs the geometry module,
      # so OpenCV 5.0.0 is compiled from source.
      #
      # /usr/local contains only the custom OpenCV installation because Rust
      # deliberately lives under /opt/rust.
      #
      # IMPORTANT:
      # bump the cache suffix whenever any OpenCV CMake option below changes.
      - name: Cache OpenCV 5
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: opencv5-rocky10-amd64-v3

      # The services process still images only.
      #
      # videoio/FFmpeg/GTK/V4L are intentionally disabled so the CI dependency
      # surface matches the scanner use case and avoids RPM Fusion packages.
      - name: Build & install OpenCV 5
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        working-directory: /
        run: |
          set -euo pipefail

          rm -rf \
            /tmp/opencv-src \
            /tmp/opencv-build

          git clone \
            --branch 5.0.0 \
            --depth 1 \
            https://github.com/opencv/opencv.git \
            /tmp/opencv-src

          cmake \
            -S /tmp/opencv-src \
            -B /tmp/opencv-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib64 \
            -DOPENCV_GENERATE_PKGCONFIG=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_LIST=core,imgproc,imgcodecs,geometry,flann \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF \
            -DBUILD_JAVA=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_DOCS=OFF \
            -DWITH_CUDA=OFF \
            -DWITH_CUDNN=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_IPP=OFF \
            -DWITH_ITT=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_GTK=OFF \
            -DWITH_V4L=OFF

          cmake \
            --build /tmp/opencv-build \
            -j"$(nproc)"

          cmake \
            --install /tmp/opencv-build

      # /usr/local/lib64 is not guaranteed to be part of RHEL's default
      # dynamic linker path.
      #
      # This has to run even after an actions/cache hit because the cache
      # restores files only; it does not recreate ldconfig's runtime state.
      - name: Register OpenCV with dynamic linker
        working-directory: /
        run: |
          set -euo pipefail

          echo "/usr/local/lib64" \
            > /etc/ld.so.conf.d/opencv5.conf

          ldconfig

      - name: Configure OpenCV discovery
        run: |
          set -euo pipefail

          echo "PKG_CONFIG_PATH=/usr/local/lib64/pkgconfig:/usr/local/lib/pkgconfig" \
            >> "$GITHUB_ENV"

      # Install the exact Rust version used by production instead of following
      # the moving `stable` channel.
      #
      # Rust deliberately lives outside /usr/local so the OpenCV cache cannot
      # accidentally archive a Rust toolchain/Cargo registry.
      - name: Install Rust 1.90.0
        working-directory: /
        run: |
          set -euo pipefail

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sSf \
            https://sh.rustup.rs \
            | sh -s -- \
              -y \
              --no-modify-path \
              --profile minimal \
              --default-toolchain 1.90.0

          echo "===== Rust ====="
          rustc --version

          echo
          echo "===== Cargo ====="
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Verify RHEL build environment
        run: |
          set -euo pipefail

          echo "===== Rust ====="
          rustc --version

          echo
          echo "===== Cargo ====="
          cargo --version

          echo
          echo "===== OpenCV version ====="
          pkg-config --modversion opencv5

          echo
          echo "===== OpenCV link flags ====="
          pkg-config --libs opencv5

          echo
          echo "===== OpenCV include flags ====="
          pkg-config --cflags opencv5

          echo
          echo "===== libclang ====="
          echo "$LIBCLANG_PATH"

          echo
          echo "===== OpenCV dynamic libraries ====="
          ldconfig -p | grep 'libopencv_' || {
            echo "OpenCV libraries were not registered with the dynamic linker"
            exit 1
          }

      - name: Build (release)
        run: |
          set -euo pipefail

          cargo build \
            --release \
            --locked

      - name: Test (release)
        run: |
          set -euo pipefail

          cargo test \
            --release \
            --locked