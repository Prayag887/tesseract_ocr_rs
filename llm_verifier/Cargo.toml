[package]
name = "llm_verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
llama-cpp-2 = { version = "0.1", features = ["common", "llguidance"] }
llguidance = "1"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
