# Single-origin gateway for local dev, mirroring the production nginx layout
# (ocr.aieynora.xyz/nid/, /passport/ — prefix stripped before the backend).
# The two services stay completely separate; only the entry point is shared,
# so the UI can reach both APIs over one port.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Without this (and without the $upstream variables
    # below) nginx resolves each backend hostname ONCE at startup and caches
    # the IP for the process lifetime — so recreating a backend container
    # hands it a new IP and every proxied request 502s until nginx itself is
    # restarted. Re-resolving on a 10s TTL makes `docker compose up -d` on a
    # backend safe to do independently.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Both services accept uploads up to 25 MiB (MAX_UPLOAD_BYTES in each
    # src/main.rs). Set slightly above that so multipart boundary overhead on
    # a genuine 25 MiB image doesn't trip nginx's own 413 first — the app's
    # JSON error is more useful to the UI than nginx's HTML error page.
    client_max_body_size 26m;

    # OCR extraction is CPU-bound and synchronous; the default 60s read
    # timeout is enough today but leaves no headroom on a large scan.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # NID API. Passing the target through a variable is what forces nginx to
    # use the resolver above per-request instead of pinning one IP at startup.
    # It also disables proxy_pass's automatic prefix stripping, so the rewrite
    # does that job explicitly: the backend sees /scan, /crop/{id},
    # /extract/{id} — exactly the paths it registers, and exactly what
    # production sends it.
    location /nid/ {
        set $nid_upstream http://nid-scan-service:3000;
        rewrite ^/nid/(.*)$ /$1 break;
        proxy_pass $nid_upstream;
    }

    # Passport API, same arrangement.
    location /passport/ {
        set $passport_upstream http://passport-scan-service:3003;
        rewrite ^/passport/(.*)$ /$1 break;
        proxy_pass $passport_upstream;
    }

    # The shared UI. Both images ship a byte-identical static/index.html, so
    # either backend can serve it; NID is picked arbitrarily. No rewrite here
    # — the path is passed through untouched.
    location / {
        set $ui_upstream http://nid-scan-service:3000;
        proxy_pass $ui_upstream;
    }
}
