<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesseract Scanner</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 960px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-size: 1.4rem; }
  #drop {
    border: 2px dashed #888;
    border-radius: 8px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  #drop.drag { background: rgba(80,140,255,0.15); border-color: #58f; }
  #drop input { display: none; }
  .row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 1.5rem; }
  .col { flex: 1 1 340px; }
  .col h3 { margin-bottom: 0.3rem; font-size: 0.9rem; opacity: 0.7; text-transform: uppercase; }
  img { max-width: 100%; border-radius: 6px; border: 1px solid #444; display: block; }
  #cropStage {
    position: relative;
    display: inline-block;
    max-width: 100%;
    touch-action: none;
  }
  #cropStage img { max-width: 100%; }
  #cropOverlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .handle {
    position: absolute;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border-radius: 50%;
    background: #3366ff;
    border: 2px solid white;
    cursor: grab;
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
  }
  .handle:active { cursor: grabbing; }
  button {
    margin-top: 1rem;
    margin-right: 0.5rem;
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border-radius: 6px;
    border: none;
    background: #3366ff;
    color: white;
    cursor: pointer;
  }
  button.secondary { background: #444; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 1rem; font-size: 0.9rem; opacity: 0.8; }
  #meta { margin-top: 0.5rem; font-size: 0.85rem; opacity: 0.7; white-space: pre-wrap; }
  #error { color: #e33; margin-top: 1rem; }
</style>
</head>
<body>
  <h1>Tesseract Document Scanner</h1>
  <div id="drop" tabindex="0">
    <p>Click, drop, or paste (Ctrl/Cmd+V) image here</p>
    <input id="file" type="file" accept="image/*">
  </div>
  <button id="scanBtn" disabled>Scan</button>
  <div id="status"></div>
  <div id="error"></div>

  <div class="row">
    <div class="col">
      <h3>Adjust crop</h3>
      <div id="cropStage" style="display:none">
        <img id="orig">
        <svg id="cropOverlay"></svg>
      </div>
      <button id="applyCropBtn" class="secondary" style="display:none">Apply crop</button>
      <button id="resetCropBtn" class="secondary" style="display:none">Reset to detected</button>
    </div>
    <div class="col">
      <h3>Scanned</h3>
      <img id="result" style="display:none">
      <div id="meta"></div>
      <h3 style="margin-top:1rem">Extracted fields</h3>
      <div id="fieldsStatus" style="font-size:0.85rem; opacity:0.7"></div>
      <pre id="fields" style="display:none; font-size:0.85rem; background:rgba(128,128,128,0.1); border-radius:6px; padding:0.75rem; overflow-x:auto;"></pre>
    </div>
  </div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const scanBtn = document.getElementById('scanBtn');
const cropStage = document.getElementById('cropStage');
const orig = document.getElementById('orig');
const overlay = document.getElementById('cropOverlay');
const applyCropBtn = document.getElementById('applyCropBtn');
const resetCropBtn = document.getElementById('resetCropBtn');
const result = document.getElementById('result');
const statusEl = document.getElementById('status');
const metaEl = document.getElementById('meta');
const errorEl = document.getElementById('error');
const fieldsStatusEl = document.getElementById('fieldsStatus');
const fieldsEl = document.getElementById('fields');

let currentFile = null;
let scanId = null;
let detectedCorners = null; // in original-image pixel space, order TL,TR,BR,BL
let corners = null;         // current (possibly user-adjusted) corners, same space

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('drag');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) setFile(fileInput.files[0]);
});

function handlePaste(e) {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) { setFile(file); e.preventDefault(); }
      break;
    }
  }
}
drop.addEventListener('paste', handlePaste);
document.addEventListener('paste', handlePaste);

function setFile(file) {
  currentFile = file;
  orig.src = URL.createObjectURL(file);
  scanBtn.disabled = false;
  cropStage.style.display = 'none';
  applyCropBtn.style.display = 'none';
  resetCropBtn.style.display = 'none';
  result.style.display = 'none';
  metaEl.textContent = '';
  errorEl.textContent = '';
  statusEl.textContent = '';
  fieldsStatusEl.textContent = '';
  fieldsEl.style.display = 'none';
  scanId = null;
  detectedCorners = null;
  corners = null;
}

scanBtn.addEventListener('click', async () => {
  if (!currentFile) return;
  scanBtn.disabled = true;
  statusEl.textContent = 'Scanning...';
  errorEl.textContent = '';
  result.style.display = 'none';

  const form = new FormData();
  form.append('image', currentFile);

  try {
    const res = await fetch('/scan', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    scanId = data.id;
    detectedCorners = data.corners;
    corners = data.corners.map((p) => [...p]);
    showResult(data.filename, data);
    setupCropUI();
    statusEl.textContent = data.corners_detected
      ? 'Done. Drag the corners below if the crop needs adjusting.'
      : 'No document edges detected — drag the corners to mark it manually.';
    runExtraction();
  } catch (err) {
    errorEl.textContent = err.message;
    statusEl.textContent = '';
  } finally {
    scanBtn.disabled = false;
  }
});

async function runExtraction() {
  if (!scanId) return;
  fieldsEl.style.display = 'none';
  fieldsStatusEl.textContent = 'Reading text...';
  try {
    const res = await fetch(`/extract/${scanId}`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    fieldsEl.textContent = JSON.stringify(data, null, 2);
    fieldsEl.style.display = 'block';
    fieldsStatusEl.textContent = '';
  } catch (err) {
    fieldsStatusEl.textContent = `Text extraction failed: ${err.message}`;
  }
}

function showResult(filename, meta) {
  result.src = `/scanned_document/${filename}?t=${Date.now()}`;
  result.style.display = 'block';
  metaEl.textContent = `id: ${meta.id ?? scanId}\ncorners_detected: ${meta.corners_detected}\nsize: ${meta.width}x${meta.height}`;
}

function setupCropUI() {
  cropStage.style.display = 'inline-block';
  applyCropBtn.style.display = 'inline-block';
  resetCropBtn.style.display = 'inline-block';
  // Wait for the image to have real layout dimensions before drawing handles.
  if (orig.complete) drawOverlay();
  else orig.onload = drawOverlay;
}

// Maps original-image pixel coords <-> displayed (CSS) coords of #orig.
function toDisplay([x, y]) {
  const scaleX = orig.clientWidth / orig.naturalWidth;
  const scaleY = orig.clientHeight / orig.naturalHeight;
  return [x * scaleX, y * scaleY];
}
function toOriginal([x, y]) {
  const scaleX = orig.naturalWidth / orig.clientWidth;
  const scaleY = orig.naturalHeight / orig.clientHeight;
  return [x * scaleX, y * scaleY];
}

let dragIndex = null;

function drawOverlay() {
  overlay.setAttribute('viewBox', `0 0 ${orig.clientWidth} ${orig.clientHeight}`);
  overlay.innerHTML = '';

  const displayPts = corners.map(toDisplay);

  const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  poly.setAttribute('points', displayPts.map((p) => p.join(',')).join(' '));
  poly.setAttribute('fill', 'rgba(51,102,255,0.25)');
  poly.setAttribute('stroke', '#3366ff');
  poly.setAttribute('stroke-width', '2');
  overlay.appendChild(poly);

  displayPts.forEach(([x, y], i) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('r', 9);
    c.setAttribute('fill', '#3366ff');
    c.setAttribute('stroke', 'white');
    c.setAttribute('stroke-width', '2');
    c.style.cursor = 'grab';
    c.addEventListener('pointerdown', (e) => {
      dragIndex = i;
      c.setPointerCapture(e.pointerId);
    });
    overlay.appendChild(c);
  });
}

overlay.addEventListener('pointermove', (e) => {
  if (dragIndex === null) return;
  const rect = overlay.getBoundingClientRect();
  const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
  const y = Math.min(Math.max(e.clientY - rect.top, 0), rect.height);
  corners[dragIndex] = toOriginal([x, y]);
  drawOverlay();
});
overlay.addEventListener('pointerup', () => { dragIndex = null; });
overlay.addEventListener('pointercancel', () => { dragIndex = null; });
window.addEventListener('resize', () => { if (corners) drawOverlay(); });

resetCropBtn.addEventListener('click', () => {
  corners = detectedCorners.map((p) => [...p]);
  drawOverlay();
});

applyCropBtn.addEventListener('click', async () => {
  if (!scanId || !corners) return;
  applyCropBtn.disabled = true;
  statusEl.textContent = 'Applying crop...';
  errorEl.textContent = '';
  try {
    const res = await fetch(`/crop/${scanId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ corners }),
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    showResult(data.filename, { corners_detected: true, width: data.width, height: data.height });
    statusEl.textContent = 'Crop applied.';
    runExtraction();
  } catch (err) {
    errorEl.textContent = err.message;
    statusEl.textContent = '';
  } finally {
    applyCropBtn.disabled = false;
  }
});
</script>
</body>
</html>
