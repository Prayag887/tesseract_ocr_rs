[package]
name = "tesseract"
version = "0.1.0"
edition = "2024"

[dependencies]
opencv = { version = "0.100", default-features = false, features = ["imgproc", "imgcodecs"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "limit", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
