# Three independent services, one container each — no shared runtime between
# them (see nid-scan-service/static/index.html: only the frontend is
# shared, byte-identical across all three services' static/ directories).
# Each builds from its own Dockerfile and its own build context, so none can
# see another's sources.
#
# An nginx `gateway` fronts all three so the UI lives on ONE host port while
# the APIs stay separate, path-routed exactly as in production:
#
#   http://localhost:3002/              -> the UI
#   http://localhost:3002/nid/          -> nid-scan-service          (prefix stripped)
#   http://localhost:3002/passport/     -> passport-scan-service     (prefix stripped)
#   http://localhost:3002/citizenship/  -> citizenship-scan-service  (prefix stripped)
#
# The backends are deliberately NOT published to the host: one forwarded port
# reaches everything, which is the whole point. To hit a backend directly for
# debugging, add a `ports:` entry back, or go through the gateway prefix.
#
# NOTE: all three Dockerfiles build OpenCV 5.0.0 from source, so the first
# `docker compose build` takes a long time (tens of minutes each, and they are
# built independently — no layer sharing between the contexts).

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: ocr-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HOST_PORT:-3002}:80"
    volumes:
      # Mount the DIRECTORY, not the single .conf file. A single-file bind
      # mount pins one inode, so any editor that writes-and-renames (most of
      # them) leaves the container serving the original file forever, with no
      # error to say so. Mounting the dir also shadows the image's stock
      # default.conf, which would otherwise also try to listen on 80.
      # The trailing `z` relabels the host dir for SELinux (a no-op on
      # Ubuntu, which doesn't enforce it, but without it nginx gets a
      # silent permission denied reading conf.d on RHEL, which does).
      - ./nginx:/etc/nginx/conf.d:ro,z
    depends_on:
      # Both images define a HEALTHCHECK, so the gateway waits until each
      # backend actually answers /health rather than merely having started —
      # model loading takes a few seconds after the process is up.
      nid-scan-service:
        condition: service_healthy
      passport-scan-service:
        condition: service_healthy
      citizenship-scan-service:
        condition: service_healthy

  nid-scan-service:
    build:
      context: ./nid-scan-service
      dockerfile: Dockerfile
    image: ocr-nid-scan-service:latest
    container_name: nid-scan-service
    restart: unless-stopped
    # Reached only via the gateway, at /nid/. Listens on the image's default
    # PORT=3000 inside the compose network.
    expose:
      - "3000"
    environment:
      # `local` = in-process ONNX (default). `paddlex` = legacy HTTP sidecar,
      # which also needs PADDLE_OCR_URL pointing at a reachable PaddleX service.
      OCR_BACKEND: "${OCR_BACKEND:-local}"
      PADDLE_OCR_MIN_CONFIDENCE: "${PADDLE_OCR_MIN_CONFIDENCE:-0.45}"
      # glibc gives each thread its own malloc arena (up to 8 x nproc), and
      # OpenCV's dnn allocates large short-lived buffers from all of them, so
      # freed memory ends up stranded across arenas instead of reused.
      # Capping at 2 measured ~35 MB lower RSS with no latency change.
      MALLOC_ARENA_MAX: "2"
      # glibc's mmap threshold is dynamic by default: it ratchets up to 32 MB as
      # it observes large blocks being freed, after which almost nothing is
      # returned to the OS. ONNX Runtime's activation buffers are exactly that
      # shape, so RSS climbed with every large image and never came back down.
      # Setting the threshold explicitly also disables the ratchet, so those
      # buffers are munmap'd on free and memory plateaus instead of growing.
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
      # Set to any value to log every recognized OCR line at INFO level.
      # OCR_DEBUG_LINES: "1"
      # SCAN_DEBUG_TIMING: "1"
      # See the passport service below for what tower_http=debug buys you.
      RUST_LOG: "${RUST_LOG:-info,tower_http=debug}"
    volumes:
      # Crops written by /scan and served back from /scanned_document. Keep
      # them out of the container layer so they survive a recreate.
      - nid-scanned-documents:/app/scanned_document
    # HEALTHCHECK is defined in the image; not repeated here.

  passport-scan-service:
    build:
      context: ./passport-scan-service
      dockerfile: Dockerfile
    image: ocr-passport-scan-service:latest
    container_name: passport-scan-service
    restart: unless-stopped
    # Reached only via the gateway, at /passport/.
    expose:
      - "3003"
    environment:
      MRZ_OCR_MIN_CONFIDENCE: "${MRZ_OCR_MIN_CONFIDENCE:-0.45}"
      # See the nid service above.
      MALLOC_ARENA_MAX: "2"
      # glibc's mmap threshold is dynamic by default: it ratchets up to 32 MB as
      # it observes large blocks being freed, after which almost nothing is
      # returned to the OS. ONNX Runtime's activation buffers are exactly that
      # shape, so RSS climbed with every large image and never came back down.
      # Setting the threshold explicitly also disables the ratchet, so those
      # buffers are munmap'd on free and memory plateaus instead of growing.
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
      # OCR_DEBUG_LINES: "1"
      # OCR_DEBUG_TIMING: "1"
      # SCAN_DEBUG_TIMING: "1"
      # tower_http=debug makes TraceLayer log every request/response, which
      # is what shows whether a browser call is reaching the container at all.
      # Drop back to plain "info" (or set RUST_LOG in the env) to quiet it.
      RUST_LOG: "${RUST_LOG:-info,tower_http=debug}"
    volumes:
      - passport-scanned-documents:/app/scanned_document

  citizenship-scan-service:
    build:
      context: ./citizenship_scanner
      dockerfile: Dockerfile
    image: ocr-citizenship-scan-service:latest
    container_name: citizenship-scan-service
    restart: unless-stopped
    # Reached only via the gateway, at /citizenship/.
    expose:
      - "3004"
    environment:
      CITIZENSHIP_OCR_MIN_CONFIDENCE: "${CITIZENSHIP_OCR_MIN_CONFIDENCE:-0.45}"
      # Detection input cap. Was 4000 (the code default), which on this
      # service's 62 MB PP-OCRv6_medium_det peaked around 900 MB of transient
      # activation memory for a single request. Verified accuracy-neutral
      # before lowering: at 1600 all six citizenship test images extract
      # byte-identical output to 4000. 960 does NOT — it changes
      # test_img1-front and test3-front — so 1600 is the floor, not a value to
      # tune down further without re-running that comparison.
      OCR_DET_MAX_SIDE: "${OCR_DET_MAX_SIDE:-1600}"
      # Watermark/lighting cleanup (preprocess.rs) runs before OCR by
      # default — set to "false" to compare against the raw crop.
      CITIZENSHIP_OCR_PREPROCESS: "${CITIZENSHIP_OCR_PREPROCESS:-true}"
      # See the nid service above.
      MALLOC_ARENA_MAX: "2"
      # glibc's mmap threshold is dynamic by default: it ratchets up to 32 MB as
      # it observes large blocks being freed, after which almost nothing is
      # returned to the OS. ONNX Runtime's activation buffers are exactly that
      # shape, so RSS climbed with every large image and never came back down.
      # Setting the threshold explicitly also disables the ratchet, so those
      # buffers are munmap'd on free and memory plateaus instead of growing.
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
      # OCR_DEBUG_LINES: "1"
      # OCR_DEBUG_CROPS: "1"
      # OCR_DEBUG_TIMING: "1"
      # SCAN_DEBUG_TIMING: "1"
      RUST_LOG: "${RUST_LOG:-info,tower_http=debug}"
    volumes:
      - citizenship-scanned-documents:/app/scanned_document

volumes:
  nid-scanned-documents:
  passport-scanned-documents:
  citizenship-scanned-documents:
